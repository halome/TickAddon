<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Tick Quick Entries <small id="version" class="muted"></small></h1>
    <button id="open-options" class="icon" title="Settings">⚙</button>
  </header>

  <section id="no-auth" hidden>
    <p>Connect the extension to your Tick account first.</p>
    <button id="go-options" class="primary">Open settings</button>
  </section>

  <main id="app" hidden>
    <div class="cal">
      <div class="cal-nav">
        <button id="prev" class="icon">‹</button>
        <strong id="month-label"></strong>
        <button id="next" class="icon">›</button>
      </div>
      <div class="weekdays"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div>
      <div id="days" class="days"></div>
      <div class="cal-actions">
        <button id="workdays">Workdays this month</button>
        <button id="clear">Clear</button>
        <span id="sel-count" class="muted"></span>
      </div>
    </div>

    <label>Project
      <input id="project-filter" type="search" placeholder="Filter projects…">
      <select id="project"></select>
    </label>
    <label>Task
      <select id="task"></select>
    </label>
    <div class="row">
      <label>Hours per day
        <input id="hours" type="number" min="0.25" max="24" step="0.25" value="8">
      </label>
    </div>
    <label>Notes
      <textarea id="notes" rows="2"></textarea>
    </label>

    <button id="submit" class="primary"></button>
    <p id="error" class="error"></p>
    <ul id="results"></ul>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
